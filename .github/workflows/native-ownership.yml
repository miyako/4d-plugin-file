name: Native ownership

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  ownership:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile production sources and full bundled SDK with ASan and UBSan
        run: python3 tests/run_native_ownership.py --output "$RUNNER_TEMP/native-ownership"
